<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Life Planner - Your Digital Journal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen active">
        <div class="login-container">
            <div class="login-doodle">
                <i class="fas fa-book-heart"></i>
            </div>
            <h1 class="login-title">✨ Welcome Back!</h1>
            <p class="login-subtitle">Your magical planner awaits</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <select id="username" required>
                        <option value="">Select User</option>
                        <option value="Satish">Satish</option>
                        <option value="Keerthi">Keerthi</option>
                        <option value="Geetanath">Geetanath (Mom's Account)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                
                <button type="button" class="btn btn-ghost" onclick="showChangePassword()">
                    <i class="fas fa-key"></i> Change Password
                </button>
            </form>
            
            <div class="login-footer">
                <p>✨ Plan • Track • Achieve ✨</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="main-app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-sparkles"></i>
                    <span>Life<strong>Planner</strong></span>
                </div>
                <button class="close-sidebar" onclick="toggleSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="user-profile">
                <div class="user-avatar" id="userAvatar">S</div>
                <div class="user-info">
                    <div class="user-name" id="userName">Satish</div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-section">
                    <div class="nav-section-title">
                        <i class="fas fa-star"></i> Main
                    </div>
                    <button class="nav-btn active" data-view="planner">
                        <i class="fas fa-calendar-days"></i>
                        <span>Planner</span>
                    </button>
                    <button class="nav-btn" data-view="habits">
                        <i class="fas fa-check-circle"></i>
                        <span>Habit Tracker</span>
                    </button>
                    <button class="nav-btn" data-view="goals">
                        <i class="fas fa-bullseye"></i>
                        <span>Goal Manager</span>
                    </button>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">
                        <i class="fas fa-heart"></i> Special
                    </div>
                    <button class="nav-btn" data-view="vision-board">
                        <i class="fas fa-image"></i>
                        <span>Vision Board</span>
                    </button>
                    <button class="nav-btn" data-view="reflections">
                        <i class="fas fa-book"></i>
                        <span>Reflections</span>
                    </button>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="sync-status" id="syncStatus">
                    <i class="fas fa-cloud-check"></i>
                    <span>Synced with Sheets</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button class="hamburger" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-info">
                    <h1 class="page-title" id="pageTitle">Planner</h1>
                    <p class="page-date" id="pageDate">Saturday, February 22, 2026</p>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" onclick="exportToPDF()" title="Export to PDF">
                        <i class="fas fa-file-pdf"></i>
                    </button>
                    <button class="btn-icon" onclick="showSettings()" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- View: Planner -->
                <div id="view-planner" class="view active">
                    <div class="planner-nav">
                        <div class="year-selector">
                            <button class="btn-icon" onclick="changeYear(-1)">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <select id="yearSelect" onchange="loadYear()">
                                <!-- Years 2020-2050 will be populated by JS -->
                            </select>
                            <button class="btn-icon" onclick="changeYear(1)">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        
                        <div class="month-tabs" id="monthTabs">
                            <!-- Month tabs will be populated by JS -->
                        </div>
                    </div>
                    
                    <div class="planner-content" id="plannerContent">
                        <!-- Dynamic content will be loaded here -->
                    </div>
                </div>

                <!-- View: Habit Tracker -->
                <div id="view-habits" class="view">
                    <!-- Habit tracker content will be loaded by habits.js -->
                </div>

                <!-- View: Goal Manager -->
                <div id="view-goals" class="view">
                    <!-- Goal manager content will be loaded by goals.js -->
                </div>

                <!-- View: Vision Board -->
                <div id="view-vision-board" class="view">
                    <!-- Vision board content will be loaded by visionboard.js -->
                </div>

                <!-- View: Reflections -->
                <div id="view-reflections" class="view">
                    <!-- Reflections content will be loaded by reflections.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals will be inserted here by JavaScript -->
    <div id="modalContainer"></div>
    
    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/habits.js"></script>
    <script src="js/goals.js"></script>
    <script src="js/visionboard.js"></script>
    <script src="js/reflections.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
